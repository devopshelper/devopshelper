<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="devopshelper — AI coding-agent tooling, Windows automation, Linux operations">
  <title>devopshelper</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="50%" stop-color="#0E1622"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <ellipse cx="240" cy="40" rx="260" ry="90" fill="#22D3EE" opacity="0.10" filter="url(#soft)"/>
  <ellipse cx="980" cy="270" rx="300" ry="100" fill="#F472B6" opacity="0.08" filter="url(#soft)"/>

  <!-- terminal chrome -->
  <rect x="56" y="52" width="228" height="30" rx="15" fill="#0F172A" stroke="#1E293B"/>
  <circle cx="76" cy="67" r="5" fill="#F87171"/>
  <circle cx="94" cy="67" r="5" fill="#FBBF24"/>
  <circle cx="112" cy="67" r="5" fill="#34D399"/>
  <text x="132" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748B">~/devopshelper</text>

  <!-- name -->
  <text x="56" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="66" font-weight="700" fill="url(#nameFill)" letter-spacing="-1">devopshelper</text>

  <rect x="56" y="188" width="520" height="3" rx="1.5" fill="url(#rule)"/>

  <text x="56" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#94A3B8">AI coding-agent tooling &#183; Windows automation &#183; Linux operations</text>

  <text x="56" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#22D3EE" opacity="0.85">&gt; building the glue around Claude Code, OpenCode &amp; DeepSeek Harness<span fill="#F472B6">_</span></text>

  <!-- side marks -->
  <g opacity="0.65">
    <rect x="1046" y="96" width="88" height="3" rx="1.5" fill="#22D3EE"/>
    <rect x="1064" y="112" width="70" height="3" rx="1.5" fill="#818CF8"/>
    <rect x="1082" y="128" width="52" height="3" rx="1.5" fill="#F472B6"/>
  </g>
</svg>
